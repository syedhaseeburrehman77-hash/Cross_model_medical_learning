[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.1.6"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.28.0",
    "flwr-datasets[vision]>=0.6.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "scikit-learn",
    "pytest",
    "wandb"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.31.0"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-evaluate = 1.0
local-epochs = 15
learning-rate = 0.001
batch-size = 16
save-model = false
fraction-fit = 1.0
min-available-clients = 4
algorithm = "fedcm_moon"
proximal-mu = 0.01
server-learning-rate = 0.1
server-momentum = 0.5
beta-1 = 0.9
beta-2 = 0.99
tau = 2                  # 0.001
fedrep-head-epochs = 1
moon-mu = 1.0
moon-lambda = 0.5        # 1.0
moon-temperature = 0.5         
moon-projection-dim = 256  
moon-momentum = 0.9
moon-weight-decay = 1e-5  
moon-warmup-rounds = 1
moon-ramp-rounds = 1
fedmlb-lambda-1 = 1.0        
fedmlb-lambda-2 = 1.0
fedmeta-alpha = 0.01             
fedmeta-beta = 0.001            
fedmeta-gradient-step = 2      
fedmeta-support-ratio = 0.1   
endpoints = 10
rho = 0.3
pers_lamda = 0
model_name = "mobilenet"
image-size = 224
dataset-name = "milk10k"
dataset-path = "data/milk10k"
scenario = "binary"    # Options: "binary", "diagnosis_1", "diagnosis_2", "diagnosis_3", "ground_truth_diagnosis"
num-classes = 2            # 2 for binary, 3 for diagnosis_1, 19 for diagnosis_2, 27 for diagnosis_3 , 11 for ground_truth_diagnosis,
compute-prototypes = false
use-wandb = false
proto-lambda = 1.0
fedpac-lambda = 1.0
fedpac-tau = 1.0
fedlc-head-epochs = 1
fedlc-alpha = 0.01
fedlc-pcs = true
fedlc-hc = true
warmup-rounds = 2
align-lambda = 0.5
transfer-tau = 15.0
proto-ema-beta = 0.7

[partition]
type = "dirichlet"   # options: iid, dirichlet, shard
alpha = 0.5          # used only for dirichlet
seed = 42
num_shards = 2       # used only for shard